<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Progress UI fixture: synthetic data only</title><link rel="stylesheet" href="../progress-to-date.css"><style>:root{--paper:#efeee9;--bone:#fbfaf7;--ink:#1a1918;--muted:#55524c;--line:#dad7ce;--brand:#a8480f;--brand-soft:#f5e8dd}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px Arial,sans-serif;line-height:1.45}main{max-width:1120px;margin:auto;padding:20px}a{color:var(--brand)}[hidden]{display:none!important}.fixture-banner{padding:20px;background:#1a1918;color:white}#test-status{font-weight:bold}</style></head><body><div class="fixture-banner">SOFTWARE TEST ONLY. All values below are synthetic. No patient storage is read or written.<p id="test-status">Loading fixture</p><button id="show-progress">Exercise progress fixture</button><button id="show-prom">Questionnaire fixture</button><button id="reload-prom">Re-render saved questionnaire fixture</button><button id="mobile">390 px preview</button><button id="desktop">Desktop preview</button></div><main><section id="progress" class="pt-page"></section><section id="prom" class="pt-page" hidden></section></main><script type="module">
import {renderProgressToDate} from '../progress-to-date.mjs';import {renderPatientMeasures} from '../patient-measures.mjs';import {dayAt,dayNumber,localDate} from '../progress-data.mjs';
const data=new Map(),storage={getItem:k=>data.get(k)||null,setItem:(k,v)=>data.set(k,v)};
const end=dayNumber(localDate()),operationDate=dayAt(end-12),options={patientId:'SYNTHETIC UI TEST',operationDate,storage};
const records=[];
for(const [exercise,metric] of [['heel_slide','maximumObservedBend'],['seated_extension','bestObservedStraightening'],['straight_leg_raise','meanHold']])for(const [i,v] of [[0,80],[1,90],[3,95],[4,92]]){
 const day=dayAt(end-4+i),value=exercise==='seated_extension'?100-v:exercise==='straight_leg_raise'?i+2:v;
 records.push({patient_id:options.patientId,operation_date:operationDate,exercise,started_at:day+'T10:00:00+01:00',measurement:{side:'left'},patient:{pain_0_10:3},exercise_analysis:{exercise,ruleVersion:'fixture-only',config:{side:'left',minVisibility:.5},metrics:{[metric]:value,hipFlexion:{maximum:35},meanReturnDuration:2,repetitionTrackingCoverage:.9,meanCycleDuration:5},reps:[{maxAdditionalBend:10-i,kneeExcursion:50+i,peakLift:30+i,returnKneeBend:10-i,maximumKneeBend:v},{maxAdditionalBend:8-i,kneeExcursion:51+i,peakLift:31+i,returnKneeBend:8-i,maximumKneeBend:v+2}]}});
}
records.sort((a,b)=>a.started_at.localeCompare(b.started_at));
function progress(){document.querySelector('#progress').hidden=false;document.querySelector('#prom').hidden=true;renderProgressToDate(document.querySelector('#progress'),records,options);}
function prom(){document.querySelector('#progress').hidden=true;document.querySelector('#prom').hidden=false;renderPatientMeasures(document.querySelector('#prom'),options);}
progress();document.querySelector('#show-progress').onclick=progress;document.querySelector('#show-prom').onclick=prom;document.querySelector('#reload-prom').onclick=prom;document.querySelector('#mobile').onclick=()=>document.querySelector('main').style.maxWidth='390px';document.querySelector('#desktop').onclick=()=>document.querySelector('main').style.maxWidth='1120px';document.querySelector('#test-status').textContent='Fixture ready: isolated in-memory storage';
// Observe actual generated export blobs in this test fixture, without changing the production downloader.
const originalCreateURL=URL.createObjectURL.bind(URL);
URL.createObjectURL=blob=>{blob.text().then(text=>{document.querySelector('#test-status').textContent='Export generated: '+blob.type+' | '+text.split('\n').slice(0,2).join(' | ');});return originalCreateURL(blob);};
</script></body></html>
