<!doctype html><html lang="en"><head>
<meta charset="utf-8"><base href="/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeee9">
<title>Exercise summary software preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="progress-to-date.css?v=1">
<link rel="stylesheet" href="exercise-summary.css?v=1">
<style>
:root{
  --paper:#efeee9;--paper2:#e7e5dd;--bone:#fbfaf7;--line:#dad7ce;--ink:#1a1918;--muted:#55524c;
  --brand:#a8480f;--brand-deep:#a8480f;--brand-soft:#f5e8dd;--go:#2a9d6a;--go-soft:#dff1e7;--warn:#b8860b;--warn-soft:#fbf1d6;
  --dk:#171716;--dk2:#20201e;--dk3:#2a2926;--dkline:rgba(255,255,255,.12);--dkink:#eef2f7;--dkmuted:#9aa6b8;--green:#3ddc84;--amber:#f2b134;--red:#ff6b6b;
  --r:2px;--shadow:0 12px 32px -14px rgba(16,28,43,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.display{font-family:"Archivo",Arial,sans-serif;font-weight:600;letter-spacing:-.015em;line-height:1.05}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-deep)}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
a{color:var(--brand-deep)}

/* ---------- home ---------- */
#home{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 80px}
.brandbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brandbar svg{width:38px;height:38px;flex:0 0 auto}
.brandbar b{font-size:14px;font-weight:700;display:block}
.brandbar span{font-size:12px;color:var(--muted);display:block;margin-top:1px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(36px,10vw,48px);margin:0 0 14px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{font-size:15.5px;color:var(--muted);margin:0;max-width:36ch}
.card{background:var(--bone);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.details{margin-top:28px}
.details h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.dayline{margin-top:12px;font-size:13px;color:var(--muted)}
.dayline b{color:var(--ink)}
.toggles{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px}
.toggles label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
details.more{margin-top:10px;font-size:12.5px;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600}
.phasepick{margin:30px 0 8px}
.phasepick .eyebrow{display:block;margin-bottom:6px}
.small-note{margin:0;font-size:13px;color:var(--muted);max-width:44ch}
.weeknav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.weeknav a{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.weeknav a.now{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.week{margin-top:26px;padding-top:4px}
.week.now{border-left:4px solid var(--brand);padding-left:14px;margin-left:-18px}
.week .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.week h2{font-family:"Archivo",Arial,sans-serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
.week .days{font-size:12.5px;color:var(--muted)}
.week .badge{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bone);background:var(--brand);padding:4px 8px;border-radius:7px}
.list{display:flex;flex-direction:column;gap:12px}
.ex-card{background:var(--bone);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;text-align:left;width:100%;transition:.15s}
.ex-card:not(:disabled):active{transform:scale(.985)}
.ex-card:disabled{cursor:default;opacity:1;color:var(--ink);background:var(--paper)}
.ex-card:disabled::after{background:var(--line)}
.ex-card:disabled .ic,.ex-card:disabled .tag{background:var(--line)}
.ex-card:disabled .ic svg{stroke:var(--muted)}
.ex-card:disabled .tag,.ex-card:disabled .meta{color:var(--muted)}
.ex-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.ex-card .ic{width:48px;height:48px;flex:0 0 auto;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center}
.ex-card .ic svg{width:26px;height:26px;stroke:var(--brand-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ex-card h3{margin:0 0 2px;font-size:16px;font-weight:650}
.ex-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.ex-card .meta{margin:4px 0 0;font-size:12px;color:var(--brand-deep);font-weight:600}
.ex-card .tag{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--brand-deep);background:var(--brand-soft);padding:5px 8px;border-radius:7px;white-space:nowrap;align-self:flex-start}
.progress{margin-top:26px}
.progress h2{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.progress p{margin:0;font-size:13.5px;color:var(--muted)}
.progress .stats{display:flex;gap:18px;margin:8px 0 10px}
.progress .stats div{font-size:12px;color:var(--muted)}
.progress .stats b{display:block;font-size:24px;color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-weight:600;line-height:1.1}
.linkbtn{display:inline-block;background:var(--ink);color:var(--bone);text-decoration:none;font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:11px}
.safety{margin:26px 0 0;padding:16px;background:var(--warn-soft);border:1px solid #ecdcbf;border-radius:14px;font-size:12.5px;color:#6b5418}
.safety b{color:#4e3d0f}
.foot{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.5}
.foot a{color:var(--muted)}

/* ---------- exercise screen ---------- */
#ex{position:fixed;inset:0;background:var(--dk);color:var(--dkink);z-index:20;display:none;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:100%}
#ex.open{display:grid}
.stage{position:relative;background:#050a14;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.stage video{display:none}
.stage canvas{max-width:100%;max-height:100%;display:block}
.stage .top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 28px;display:flex;align-items:flex-start;gap:12px;background:linear-gradient(180deg,rgba(5,10,20,.85),rgba(5,10,20,0));pointer-events:none}
.stage .top>*{pointer-events:auto}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--dkline);background:rgba(255,255,255,.1);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;line-height:1}
.stage .title{flex:1;min-width:0}
.stage .title .eyebrow{color:#9fc4f0}
.stage .title h2{margin:2px 0 0;font-size:18px;font-weight:600;font-family:"Archivo",Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .clockwrap{display:flex;align-items:center;gap:8px;align-self:center;font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;background:rgba(5,10,20,.65);border:1px solid var(--dkline);color:var(--dkmuted)}
.stage .rec{display:none;width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
.stage .rec.on{display:inline-block}
@keyframes blink{50%{opacity:.25}}
.stage .track{position:absolute;left:16px;right:16px;bottom:16px;width:max-content;max-width:calc(100% - 32px);font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:9px;background:rgba(5,10,20,.65);border:1px solid var(--dkline);color:var(--amber);display:flex;align-items:center;gap:7px}
.stage .track::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:currentColor}
.stage .track.ok{color:var(--green)}
.stage .track.off{color:var(--dkmuted)}

.panel{background:var(--dk2);border-left:1px solid var(--dkline);padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.tile{background:var(--dk3);border:1px solid var(--dkline);border-radius:14px;padding:12px 14px}
.tile .lab{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dkmuted)}
.tile .val{font-family:"Archivo",Arial,sans-serif;font-weight:600;font-size:44px;line-height:1;margin-top:6px}
.tile .val small{font-size:18px;color:var(--dkmuted);font-weight:500;margin-left:2px}
.tile .sub{font-size:12px;color:var(--dkmuted);margin-top:6px}
.tile .sub b{color:var(--dkink);font-weight:600}
.tile.reps .val{color:var(--green)}
.tile.angle.inzone{border-color:rgba(61,220,132,.5);background:rgba(42,157,106,.22)}
.bar{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:10px;overflow:visible}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand);width:0;transition:width .12s}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.35);border-left:2px solid var(--green)}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile.instr ol{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--dkink);line-height:1.45}
.tile.instr li{margin-bottom:5px}
.tile.hold .ring{display:flex;align-items:center;gap:14px;margin-top:6px}
.tile.hold .cue{font-family:"Archivo",Arial,sans-serif;font-size:30px;font-weight:600;line-height:1}
.tile.hold .count{font-size:44px;font-family:"Archivo",Arial,sans-serif;font-weight:600;color:var(--amber);min-width:56px;text-align:right}
.tile.hold.on .count{color:var(--green)}
.panel .status{font-size:13.5px;line-height:1.4;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--dkline);color:var(--dkink)}
.panel .status.ok{background:rgba(42,157,106,.2);border-color:rgba(61,220,132,.45)}
.panel .actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{border:1px solid var(--dkline);background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:600;padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand)}
.btn.finish{background:var(--green);border-color:var(--green);color:#06261a;flex:1}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{font-size:12.5px;padding:9px 12px}

/* veil, brief, done */
.veil{position:absolute;inset:0;z-index:8;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:8px}
.veil.hide{display:none}
.veil .spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--brand);animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.veil h3{font-family:"Archivo",Arial,sans-serif;font-size:22px;margin:0;font-weight:600}
.veil p{color:var(--dkmuted);font-size:14px;margin:4px 0 0;max-width:34ch}
.veil .small{font-size:11.5px;color:var(--dkmuted);opacity:.7;margin-top:14px}
.brief{position:absolute;z-index:7;left:0;right:0;bottom:0;background:var(--bone);color:var(--ink);border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .3s ease;max-height:80%;overflow:auto}
.brief.up{transform:none}
.brief .grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.brief h3{margin:0 0 2px;font-family:"Archivo",Arial,sans-serif;font-size:22px;font-weight:600}
.brief .meta{font-size:12.5px;color:var(--brand-deep);font-weight:600;margin-bottom:12px}
.brief ol{margin:0 0 12px;padding-left:20px}
.brief ol li{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.brief .setup{font-size:12.5px;color:var(--muted);background:var(--paper2);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.brief .start{width:100%;background:var(--ink);color:var(--bone);border:none;font-size:16px;font-weight:650;padding:15px;border-radius:14px;cursor:pointer}
.brief .start:disabled{opacity:.5}
.brief .hands{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.brief .hands .bar{flex:0 0 90px;height:8px;border-radius:5px;background:var(--paper2);overflow:hidden}
.brief .hands .fill{height:100%;width:0;background:var(--brand);transition:width .1s linear}
.countdown{position:absolute;inset:0;z-index:8;display:grid;place-items:center;font-family:"Archivo",Arial,sans-serif;font-weight:600;font-size:clamp(120px,30vh,260px);color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.7);cursor:pointer;text-align:center}
.countdown small{display:block;font-family:"Inter",sans-serif;font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--dkmuted)}
.handring{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:6;width:min(520px,80%);text-align:center;pointer-events:none}
.handring .htext{font-family:"Archivo",Arial,sans-serif;font-weight:600;font-size:clamp(26px,5vh,44px);color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8);margin-bottom:10px}
.handring .hbar{height:14px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.handring .hfill{height:100%;width:0;background:var(--green);transition:width .1s linear}
.handring.finish .hfill{background:var(--amber)}
.stage .mic{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.done{position:fixed;inset:0;z-index:30;background:rgba(11,18,32,.97);display:none;overflow:auto;padding:26px 20px}
.done.show{display:block}
.done .inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.done h2{font-family:"Archivo",Arial,sans-serif;font-size:30px;margin:0;font-weight:600}
.done p{color:var(--dkmuted);font-size:15px;margin:0;max-width:40ch}
.done .stats{display:flex;gap:26px;margin:10px 0 4px;flex-wrap:wrap;justify-content:center}
.done .stats div{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dkmuted);font-weight:700}
.done .stats b{display:block;font-family:"Archivo",Arial,sans-serif;font-size:38px;font-weight:600;color:#fff;letter-spacing:0;text-transform:none;line-height:1.1}
.done .chart{width:min(760px,92vw);margin:6px 0 4px}
.done .chart svg{width:100%;height:auto;border-radius:10px}
.done .q h3{font-family:"Archivo",Arial,sans-serif;font-size:24px;margin:8px 0 2px;font-weight:600}
.done .scale{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.done .scale button{min-width:52px;font-size:20px;padding:12px 0;border-radius:12px;border:1px solid var(--dkline);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.done .scale button:hover{background:var(--brand)}
.done .skip{background:none;border:none;color:var(--dkmuted);font-size:13px;margin-top:10px;cursor:pointer;text-decoration:underline}
.done .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.done .row a{display:inline-block;text-decoration:none;color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--dkline)}
.done .ring{width:84px;height:84px;border-radius:50%;border:4px solid var(--green);display:grid;place-items:center;margin-bottom:6px}
.done .ring svg{width:40px;height:40px;stroke:var(--green);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* narrow screens: video on top, panel below */
@media (max-width:879px), (orientation:portrait){
  #ex.open{display:flex;flex-direction:column}
  .stage{flex:1 1 auto;min-height:38vh}
  .panel{border-left:none;border-top:1px solid var(--dkline);padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);gap:10px;max-height:52vh}
  .tile .val{font-size:34px}
  .tile.instr{display:none}
  .panel .actions .btn{padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cambridge Kinematics visual identity: Archivo, warm paper and restrained orange. */
#home{max-width:1200px;padding:0 40px 64px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:72px}
.brandbar{grid-column:1/-1;justify-content:space-between;margin:0 0 64px;padding:16px 0;border-bottom:1px solid var(--line)}
.brand-link{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brandbar svg{width:60px;height:60px}
.brandbar b{font-size:15.5px;line-height:1.08;font-weight:900;letter-spacing:.045em;text-transform:uppercase}
.brandbar .product-name{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hero{align-self:center;padding:8px 0 32px}
.development-label{font-size:11px;letter-spacing:.12em;margin-bottom:20px;display:flex;align-items:center;gap:9px}
.development-label::before{content:"";width:6px;height:6px;background:#e2691c;border-radius:50%;flex:none}
.hero h1{font-size:clamp(40px,5.2vw,64px);font-weight:900;letter-spacing:-.035em;line-height:1.04;margin-bottom:22px}
.hero h1 em{color:var(--ink)}
.hero p{font-size:15px;line-height:1.7;max-width:46ch}
.details{margin:0;padding:24px;align-self:start}
.details h2{color:var(--ink);margin-bottom:18px}
label.f input,label.f select{border-radius:2px;min-height:44px;background:var(--bone)}
.phasepick{grid-column:1/-1;margin:54px 0 0;padding-top:28px;border-top:1px solid var(--line)}
.phasepick .eyebrow{color:var(--ink);font-size:12px;margin-bottom:12px}
.small-note{max-width:90ch;font-size:14px;line-height:1.65}
.weeknav{gap:10px;margin-top:22px}
.weeknav a{border-radius:2px;padding:12px 18px;text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--ink);background:transparent;border-color:var(--ink)}
.weeknav a:hover{border-color:var(--brand);color:var(--brand)}
#weeks{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 32px;margin-top:36px}
.week{margin:0;padding-top:18px;border-top:2px solid var(--ink);scroll-margin-top:24px}
.week.now{border-left:0;border-top-color:var(--brand);padding-left:0;margin-left:0}
.week .head{gap:8px;margin-bottom:18px}
.week h2{font-size:26px;font-weight:800;letter-spacing:-.025em}
.week .days{font-size:11px}
.week .badge{border-radius:2px;font-size:9px}
.list{gap:10px}
.ex-card{padding:18px 16px;gap:12px;min-height:116px;align-items:flex-start}
.ex-card::after{width:3px}
.ex-card .ic{width:38px;height:38px;border-radius:2px}
.ex-card .ic svg{width:23px;height:23px}
.ex-card h3{font-size:15px;font-weight:800;line-height:1.3;margin-bottom:5px}
.ex-card p{line-height:1.5}
.ex-card .meta{font-size:11px;margin-top:7px}
.ex-card .tag{border-radius:2px;font-size:9px;padding:4px 6px;text-transform:uppercase;letter-spacing:.04em}
.ex-card:not(:disabled):hover{border-color:var(--brand);background:#f8f3ed}
.ex-card:disabled{border-style:dashed}
.ex-card:disabled .ic,.ex-card:disabled .tag{background:var(--paper2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #1d5c57;outline-offset:4px}
.progress,.safety,.foot{grid-column:1/-1}
