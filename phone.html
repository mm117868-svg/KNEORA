<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kneora remote</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#191919;font:18px system-ui}main{max-width:460px;margin:auto;padding:28px 20px}h1{font-size:30px;margin:0 0 22px}h2{font-size:23px}#status{line-height:1.5;min-height:54px}button{display:block;width:100%;min-height:76px;border:0;border-radius:12px;margin:14px 0;font:700 23px system-ui;background:#205b43;color:white}button:disabled{opacity:.35}#finish{background:#812e22}#sound{background:transparent;color:#222;border:2px solid #666;font-size:18px;min-height:56px}small{display:block;color:#555;line-height:1.5}#exercises button{background:white;color:#222;border:1px solid #aaa;font-size:19px;min-height:60px}summary{padding:18px 0;cursor:pointer}button:focus-visible{outline:4px solid #b64e08;outline-offset:3px}</style></head><body><main><h1>Kneora remote</h1><h2 id="exercise">Connect to your computer</h2><p id="status" role="status">Scan the pairing code shown on the computer. Keep both devices on the same Wi-Fi.</p><button id="primary" disabled>Start</button><button id="finish" disabled>Finish exercise</button><button id="sound" disabled>Voice on</button><details id="exerciseList" open><summary>Choose an exercise</summary><div id="exercises"></div></details><small>The exercise picture and results stay on the computer.</small></main><script type="module" src="./phone-remote.mjs"></script></body></html>
